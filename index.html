<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon game</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <h1>Simon Says Game</h1>
    <h2>Press any key to start</h2>
    <div class="container">
      <div class="line-one">
        <div class="btn red" type="button" id="red"><b>red</b></div>
        <div class="btn yellow" type="button" id="yellow"><b>yellow</b></div>
      </div>
    <div class="line-two">
           <div class="btn green" type="button" id="green"><b>green</b></div>
           <div class="btn blue" type="button" id="blue"><b>blue</b></div>
    </div>    
          
    </div>
    <script src="app.js"></script>
</body>
</html>
